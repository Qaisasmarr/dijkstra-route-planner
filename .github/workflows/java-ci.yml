name: Java CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test
        run: bash scripts/test.sh
      - name: CLI smoke test
        run: bash scripts/run.sh --from Downtown --to University --mode balanced --risk-budget 6
